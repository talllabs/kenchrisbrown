<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KC Brown – Video Work</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }

  .carousel {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .player {
    position: relative;
    padding-top: 56.25%;
    background: #000;
  }

  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .thumbs {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .thumb {
    flex: 0 0 auto;
    width: 120px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s ease;
    border: 2px solid transparent;
  }

  .thumb.active {
    opacity: 1;
    border-color: #fff;
  }

  .thumb img {
    width: 100%;
    display: block;
  }
</style>
</head>

<body>

<div class="carousel">

  <!-- MAIN PLAYER -->
  <div class="player">
    <iframe
      id="vimeoPlayer"
      src="https://player.vimeo.com/video/85489219?title=0&byline=0&portrait=0&controls=1"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <!-- THUMBNAILS -->
  <div class="thumbs" id="thumbs">

    <div class="thumb active" data-id="85489219">
      <img src="https://vumbnail.com/85489219.jpg" alt="Camp TOMS">
    </div>

    <div class="thumb" data-id="196013297">
      <img src="https://vumbnail.com/196013297.jpg" alt="Apple Watch Band">
    </div>

    <div class="thumb" data-id="866610422">
      <img src="https://vumbnail.com/866610422.jpg" alt="Magic Bus">
    </div>

    <div class="thumb" data-id="293608639">
      <img src="https://vumbnail.com/293608639.jpg" alt="South Shore Drill Team">
    </div>

    <div class="thumb" data-id="322411122">
      <img src="https://vumbnail.com/322411122.jpg" alt="Stand For Tomorrow">
    </div>

    <div class="thumb" data-id="3744527">
      <img src="https://vumbnail.com/3744527.jpg" alt="Spaceboy vs The House Warden">
    </div>

  </div>

</div>

<script>
  const player = document.getElementById("vimeoPlayer");
  const thumbs = document.querySelectorAll(".thumb");

  thumbs.forEach(thumb => {
    thumb.addEventListener("click", () => {
      const id = thumb.dataset.id;

      player.src =
        "https://player.vimeo.com/video/" +
        id +
        "?title=0&byline=0&portrait=0&controls=1&autoplay=1";

      thumbs.forEach(t => t.classList.remove("active"));
      thumb.classList.add("active");
    });
  });
</script>

</body>
</html>
